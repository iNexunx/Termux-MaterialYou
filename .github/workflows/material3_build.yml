name: Material You build

on:
  workflow_dispatch:
  push:
    branches:
      - material3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build universal debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: v0.119.0-beta.3+material3-github-debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Termux-MaterialYou-universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
